<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folklore & Code - Design Concepts</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.board{width:1440px;height:900px;overflow:hidden;position:relative;padding:24px}.label{position:absolute;top:16px;left:28px;z-index:9;font:700 14px/1 Arial;letter-spacing:.18em;text-transform:uppercase}.desktop{position:absolute;left:24px;top:52px;width:1080px;height:824px;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:12px}.mobile{position:absolute;right:24px;top:52px;width:280px;height:606px;overflow:hidden;border:7px solid #272727;border-radius:28px;box-shadow:0 18px 60px #000}.mobile:before{content:"";position:absolute;z-index:20;top:7px;left:98px;width:70px;height:14px;border-radius:12px;background:#080808}.nav{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.13)}.brand{font-weight:800;letter-spacing:-.04em}.links{display:flex;gap:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;padding:22px 28px}.hero h1{font-size:72px;line-height:.87;margin:12px 0;letter-spacing:-.07em}.eyebrow,.meta{font-size:10px;letter-spacing:.18em;text-transform:uppercase}.hero p{max-width:490px;font-size:13px;line-height:1.5;color:#c8c8c8}.feature{min-height:270px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.feature h2{font-size:30px;line-height:1;margin:7px 0}.grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-auto-rows:138px;gap:12px;padding:0 28px}.card{padding:16px;border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.card h3{margin:0;font-size:18px;line-height:1.05}.wide{grid-row:span 2}.cats{margin:14px 28px;display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 11px;border:1px solid currentColor;border-radius:20px;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.foot{height:42px;margin:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.mobile .nav{height:52px;padding:0 14px}.mobile .links span:nth-child(n+3){display:none}.mobile .links{gap:9px;font-size:7px}.mobile .hero{display:block;padding:20px 14px 10px}.mobile .hero h1{font-size:41px;margin:12px 0}.mobile .hero p{font-size:9px}.mobile .feature{min-height:130px;margin-top:14px;padding:12px}.mobile .feature h2{font-size:18px}.mobile .grid{grid-template-columns:1fr 1fr;grid-auto-rows:106px;padding:0 14px;gap:8px}.mobile .card{padding:10px;border-radius:9px}.mobile .card h3{font-size:11px}.mobile .wide{grid-row:span 1;grid-column:span 2}.mobile .cats{margin:9px 14px;gap:5px}.mobile .pill{font-size:6px;padding:4px 6px}.mobile .foot{margin:0 14px;font-size:6px}.mobile .grid .card:nth-child(n+5){display:none}

    .folk{background:#110f0d}.folk .desktop,.folk .mobile{background:#15110f}.folk .label{color:#efad4b}.folk .nav{background:#a93425;border-bottom:5px double #efad4b}.folk .brand{font-family:Georgia,serif;font-size:20px}.folk .hero{background:repeating-linear-gradient(45deg,transparent 0 24px,rgba(239,173,75,.07) 25px 27px)}.folk h1,.folk h2,.folk h3{font-family:Georgia,serif}.folk .hero h1{color:#f4dbc0;text-shadow:3px 3px 0 #8d2d22}.folk .feature{background:linear-gradient(155deg,#8c2c22,#421b17);border:2px solid #efad4b;border-radius:33% 12px 30% 12px}.folk .card{background:#201b17;border:1px solid #a95738;box-shadow:inset 0 0 0 3px #15110f,inset 0 0 0 4px #604526}.folk .card:nth-child(2n){background:#19302c}.folk .pill{color:#efad4b}.folk .foot{border-top:1px dashed #a95738}.folk .mobile .nav{border-bottom-width:3px}.folk .mobile .hero h1{font-size:36px}

    .bold{background:#080808}.bold .desktop,.bold .mobile{background:#0b0b0b}.bold .label{color:#ff3c35}.bold .nav{border-bottom:1px solid #555}.bold .brand{font-family:Georgia,serif;font-style:italic}.bold .hero{grid-template-columns:1.45fr .55fr;padding-top:36px}.bold .hero h1{font-family:Georgia,serif;font-size:96px;font-weight:400;max-width:680px}.bold .hero h1::first-line{color:#ff3c35}.bold .feature{border-radius:0;background:#f1eee8;color:#111;transform:translateY(24px)}.bold .feature .meta,.bold .feature p{color:#555}.bold .grid{grid-template-columns:1.4fr .6fr .6fr;border-top:1px solid #444;padding-top:14px}.bold .card{border-radius:0;border-width:0 0 1px 0;background:#0b0b0b}.bold .card h3{font-family:Georgia,serif;font-weight:400}.bold .card:first-child{background:#ff3c35;color:#0b0b0b}.bold .pill{border-radius:0;color:#ddd}.bold .mobile .hero h1{font-size:50px}.bold .mobile .feature{transform:none}.bold .mobile .grid{border-top:0}

    .lab{background:#06070c}.lab .desktop,.lab .mobile{background:radial-gradient(circle at 70% 5%,#211757 0,transparent 34%),#070910}.lab .label{color:#a6ff4d}.lab .nav{background:rgba(15,17,30,.75);backdrop-filter:blur(14px)}.lab .brand{color:#a6ff4d}.lab .hero h1{font-family:"Arial Black",Arial,sans-serif;color:#f3f5ff}.lab .hero{background-image:linear-gradient(rgba(91,233,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(91,233,255,.05) 1px,transparent 1px);background-size:24px 24px}.lab .feature,.lab .card{background:rgba(20,25,45,.68);backdrop-filter:blur(12px);border:1px solid rgba(112,239,255,.42);box-shadow:0 0 22px rgba(97,89,255,.16),inset 0 0 22px rgba(93,232,255,.05)}.lab .feature{border-radius:18px;background:linear-gradient(145deg,rgba(93,63,255,.48),rgba(9,19,31,.7))}.lab .card:nth-child(3n){border-color:#a6ff4d}.lab .pill{color:#68eaff;background:rgba(35,163,193,.1)}.lab .foot{color:#8d97ad}.lab .mobile .hero h1{font-size:39px}

    .darkroom{background:#0e0a08}.darkroom .desktop,.darkroom .mobile{background:radial-gradient(circle at 20% 10%,rgba(164,84,38,.2),transparent 35%),#130e0b}.darkroom .label{color:#d69555}.darkroom .desktop{border:8px ridge #4f3020}.darkroom .nav{background:#1b120e;border-bottom:1px solid #5b3826}.darkroom .brand,.darkroom h1,.darkroom h2,.darkroom h3{font-family:Georgia,serif}.darkroom .hero h1{font-weight:400;color:#e7d0b6}.darkroom .feature{background:linear-gradient(rgba(43,23,14,.22),rgba(15,8,5,.65)),linear-gradient(120deg,#6c4633,#1b1613);border:8px solid #e0d2bb;border-bottom-width:24px;transform:rotate(1.2deg);box-shadow:0 16px 30px #000}.darkroom .card{background:#d9d0bd;color:#1d1713;border-radius:3px;border:0;border-bottom:16px solid #eee5d3;box-shadow:0 12px 25px #000;transform:rotate(-.7deg)}.darkroom .card:nth-child(2n){transform:rotate(.8deg);background:#8a5238;color:#f5e8d7;border-bottom-color:#b88261}.darkroom .pill{color:#d69555;border-color:#815237}.darkroom .foot{color:#9e806a;border-top:1px solid #563726}.darkroom .mobile .desktop{border:0}
  </style>
</head>
<body>
  <script>
    const concepts=[
      {id:'a',cls:'folk',name:'Concept A - Folk Canvas',tag:'Stories, systems, and small discoveries',hero:'Folklore<br>& Code',feature:'The quiet craft of building software',posts:['Memory Maps for Modern Java','Relearning C++ Through Small Programs','Designing a Better Reading Stack','RecyclerView: What Actually Gets Reused','Notes from a Static-First Web','Markdown as a Thinking Tool']},
      {id:'b',cls:'bold',name:'Concept B - Editorial Bold',tag:'A journal about code and the culture around it',hero:'Ideas<br>in Motion',feature:'Software is a material, not just a tool',posts:['Against Invisible Architecture','The Stack Is a Story','How Interfaces Teach Us','Five Notes on Useful Friction','Reading Systems Slowly','A Field Guide to Memory']},
      {id:'c',cls:'lab',name:'Concept C - Neo-Bento Lab',tag:'Technical field notes from a curious workshop',hero:'Signal<br>Archive',feature:'Mapping the invisible life of a program',posts:['Cache Protocol 05','Runtime Signals','A Small Java Atlas','Interface Experiments','Static Systems Log','Syntax Field Notes']},
      {id:'d',cls:'darkroom',name:'Concept D - Warm Darkroom',tag:'Developing thoughts about technology and making',hero:'Notes<br>After Dark',feature:'What remains after the build is finished',posts:['A Photograph of the Heap','Fragments from an Android Screen','The Warmth of Plain Text','Developing Better Defaults','A C++ Contact Sheet','Archive of Tiny Lessons']}
    ];
    const card=(t,i)=>`<article class="card ${i===0?'wide':''}"><span class="meta">${['Java','Essay','Design','Android','Web','Notes'][i]} · JUN ${12-i}</span><h3>${t}</h3><span class="meta">Read note →</span></article>`;
    const view=c=>`<div class="nav"><span class="brand">Folklore & Code</span><div class="links"><span>Posts</span><span>Categories</span><span>About</span><span>RSS</span></div></div><section class="hero"><div><span class="eyebrow">Independent technical journal · 2026</span><h1>${c.hero}</h1><p>${c.tag}. Exploring interfaces, programming languages, memory models, and the patient craft behind useful software.</p></div><article class="feature"><span class="meta">Featured · Essay · June 12</span><h2>${c.feature}</h2><p>A field note on attention, systems, and making digital things that deserve to last.</p></article></section><section class="grid">${c.posts.map(card).join('')}</section><div class="cats">${['Android','Java','C++','Interfaces','Field Notes'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><footer class="foot"><span>GitHub · Mastodon · RSS</span><span>Built with Next.js & patient curiosity</span></footer>`;
    const file=location.pathname.toLowerCase();
    const selected=file.includes('concept-a')?['a']:file.includes('concept-b')?['b']:file.includes('concept-c')?['c']:file.includes('concept-d')?['d']:concepts.map(c=>c.id);
    document.body.innerHTML=concepts.filter(c=>selected.includes(c.id)).map(c=>`<section id="${c.id}" class="board ${c.cls}"><div class="label">${c.name}</div><main class="desktop">${view(c)}</main><aside class="mobile">${view(c)}</aside></section>`).join('');
  </script>
</body>
</html>
